name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - preview/court-canvas-cad0d5f
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Test runtime, board model, and UI
        run: npm run test:runtime
      - name: Build
        run: npm run build
      - name: Prepare project Pages paths
        run: npm run prepare:pages
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}/
      - name: Verify Pages artifact
        run: npm run test:pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/github-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
